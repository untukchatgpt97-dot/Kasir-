<!doctype html>
<html lang="id"><head><meta charset="utf-8">

<title>Smart Kasir Pro</title>
<style>

:root[data-theme=dark]{--g:#7bd480;--g2:#5cb862;--bg:#121512;--c:#1c201c;--t:#e8ece8;--m:#9aa39b;--ln:#2b312b;--er:#ff8a80;--wn:#ffb74d;--on:#0b1f0d}

main{padding:14px 14px 150px;max-width:640px;margin:0 auto}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}

.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
#rcp{display:none}@media print{body>*{display:none!important}#rcp{display:block!important;white-space:pre;font:12px monospace;color:#000}@page{margin:2mm}}
</style></head><body>
<main id="app"></main><nav id="nv"></nav><dialog id="dl"></dialog><pre id="rcp"></pre>
<script>
const E=s=>document.querySelector(s),$$=(s,f)=>document.querySelectorAll(s).forEach(f);
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
const R=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');

const iso=t=>new Date(t+252e5).toISOString().replace('Z','+07:00');
const sum=(a,k)=>a.reduce((x,y)=>x+(y[k]||0),0);
let mem=null;
function load(){try{return JSON.parse(localStorage.getItem('skp'))||mem}catch(e){return mem}}
function save(){mem=D;try{localStorage.setItem('skp',JSON.stringify(D))}catch(e){}}
let D=load()||{dev:uid().slice(0,4).toUpperCase(),shop:'',users:[],cats:['Makanan','Minuman','Rokok','Sembako','Peralatan rumah tangga','Produk kebersihan','Obat-obatan bebas','Lain-lain'],prod:[],sales:[],mov:[],q:[],log:[]};D.tg=D.tg||{tok:'',chat:''};D.tq=D.tq||[];D.qris=D.qris||'';D.wa=D.wa||{url:'https://api.fonnte.com/send',tok:'',to:''};D.wq=D.wq||[];

const lg=(a,d)=>D.log.push({id:uid(),u:U&&U.id,a,d,t:Date.now(),dev:D.dev});
async function hp(p,s){try{const e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(p),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:e.encode(s),iterations:50000},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s+p)h=(h*33^c.charCodeAt(0))>>>0;return'f'+h}}
const own=()=>U&&U.role=='owner';
const sub=()=>cart.reduce((a,l)=>a+l.q*l.p,0),tot=()=>Math.max(0,sub()-disc);

:hd('Smart Kasir Pro')+`<p class=k>Buat akun pemilik. PIN dipakai setiap kali membuka aplikasi.</p><label>Nama pemilik</label><input id=sn maxlength=40><label>PIN (4 sampai 6 angka)</label><input id=s1 type=password inputmode=numeric maxlength=6><label>Ulangi PIN</label><input id=s2 type=password inputmode=numeric maxlength=6><p class=lo>${esc(msg)}</p><button class=w data-a=setup>Mulai pakai</button>`}
function home(){const td=day(Date.now()),S=D.sales.filter(s=>s.st=='OK'&&day(s.t)==td),P=D.prod.filter(p=>p.on),pend=D.q.filter(x=>x.st=='PENDING').length,top={};
D.sales.filter(s=>s.st=='OK'&&Date.now()-s.t<2592e6).forEach(s=>s.items.forEach(i=>top[i.n]=(top[i.n]||0)+i.q));
const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),on=navigator.onLine,card=(k,v)=>`<div class=c><div class=k>${k}</div><div class=v>${v}</div></div>`;
return hd('Halo, '+esc(U.name))+`<div class=c><span class=dot style="background:${on?'var(--g2)':'var(--wn)'}"></span> ${on?'Online':'Offline'}. ${pend} transaksi tersimpan di HP ini, sinkron cloud belum aktif.</div>
<div class=c><div class=k>Omzet hari ini</div><div class=big>${R(sum(S,'total'))}</div></div>
<div class=g>${own()?card('Laba kotor',R(sum(S,'total')-sum(S,'cost'))):''}${card('Transaksi',S.length)}${card('Jumlah produk',P.length)}${card('Total stok',sum(P,'stock'))}${card('Stok menipis',P.filter(p=>p.stock>0&&p.stock<=p.min).length)}${card('Stok habis',P.filter(p=>p.stock<=0).length)}</div>
<h2>Produk terlaris, 30 hari</h2><div class=c>${tp.map(x=>`<div class="r sb"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')||'<span class=k>Belum ada penjualan.</span>'}</div>
<h2>Transaksi terakhir</h2><div class=c>${D.sales.slice(-5).reverse().map(s=>`<div class="r sb"><span>${s.inv}</span><b>${R(s.total)}</b></div>`).join('')||'<span class=k>Belum ada transaksi.</span>'}</div>`}
const match=p=>!q||(p.n+' '+(p.bc||'')).toLowerCase().includes(q.toLowerCase());
function pl(){const L=D.prod.filter(p=>p.on&&match(p));if(!L.length)return`<p class=k>${D.prod.length?'Tidak ada produk yang cocok.':'Belum ada produk. '+(own()?'Ketuk + di tab Produk untuk menambah.':'Minta pemilik menambahkannya.')}</p>${own()&&tab=='pos'?`<button class=w data-a=padd data-i="${esc(q)}">Tambah produk${q?' ‘'+esc(q)+'’':''}</button>`:''}`;
return L.map(p=>tab=='pos'?`<div class="c r"><div class=f><b>${esc(p.n)}</b><div class=v>${R(p.sell)}</div><div class="k ${p.stock<=p.min?'lo':''}">${p.stock>0?'Stok '+p.stock+' '+esc(p.unit):'Stok habis'}</div></div><button class=s data-a=add data-i="${p.id}" ${p.stock<=0?'disabled':''} aria-label="Tambah ${esc(p.n)}">+</button></div>`
:`<div class="c r" ${own()?`data-a=pedit data-i="${p.id}"`:''}><div class=f><b>${esc(p.n)}</b><div class=k>Beli ${R(p.cost)}, jual ${R(p.sell)}${p.cat?', '+esc(p.cat):''}</div></div><div style="text-align:right"><b class="v ${p.stock<=p.min?'lo':''}">${p.stock}</b><div class=k>${esc(p.unit)}</div></div></div>`).join('')}
function pos(){const n=cart.reduce((a,l)=>a+l.q,0);return hd('Kasir')+`<div class=r><input id=q placeholder="Cari nama atau ketik barcode, lalu Enter" value="${esc(q)}" enterkeyhint=search style="flex:1;min-width:0"><button class=s style="margin-bottom:4px" data-a=scan>Scan</button></div><p class=k style="margin:0 0 6px">Pemindai Bluetooth atau USB juga bisa dipakai: scan kapan saja, barang langsung masuk keranjang.</p>${msg?`<p class=lo>${esc(msg)}</p>`:''}<div id=pl>${pl()}</div>`+(n?`<div class=fx><button class="w r sb" data-a=cart><span>Lihat keranjang (${n} barang)</span><span>${R(sub())}</span></button></div>`:'')}
function produk(){return hd('Produk')+(own()?`<div class=r style="margin-bottom:8px"><button class=f data-a=pedit data-i="">Tambah produk baru</button><button class="o f" data-a=impick>Impor CSV</button></div><input type=file id=ci accept=".csv,text/csv" hidden><p class=k>Impor CSV: kolom Nama, Barcode, Harga beli, Harga jual, Stok, Satuan, Kategori. Di Excel, simpan sebagai CSV.</p>${msg?`<p class=k><b>${esc(msg)}</b></p>`:''}`:'')+`<input id=q placeholder="Cari nama atau barcode" value="${esc(q)}"><div id=pl>${pl()}</div>`+(own()?`<button class=fx data-a=pedit data-i="" style="left:auto;right:14px;width:60px;height:60px;border-radius:30px;font-size:1.8rem;padding:0" aria-label="Tambah produk">+</button>`:'')}
function riwayat(){return hd('Riwayat transaksi')+(own()&&D.sales.length?`<button class="o w" style="margin-bottom:10px;color:var(--er);border-color:var(--er)" data-a=rdel>Hapus riwayat transaksi</button>`:'')+(D.sales.slice(-100).reverse().map(s=>`<div class="c r" data-a=sale data-i="${s.id}"><div class=f><b>${s.inv}</b><div class=k>${dt(s.t)}, ${esc(s.cu)}</div><div class=k>${s.sync=='SYNCED'?'Sudah tersinkron':'Tersimpan di HP, menunggu sinkron'}</div></div><b class=v>${R(s.total)}</b></div>`).join('')||'<p class=k>Belum ada transaksi. Transaksi pertama muncul di sini setelah Anda menjual sesuatu di tab Kasir.</p>')}
function more(){return hd('Lainnya')+`<div class=c><b>${esc(U.name)}</b><div class=k>${own()?'Pemilik toko':'Kasir'}</div></div>`+(own()?`<h2>Laporan penjualan</h2><div class=r><button class="o f" data-a=rep data-i=0>Hari ini</button><button class="o f" data-a=rep data-i=7>7 hari</button><button class="o f" data-a=rep data-i=30>30 hari</button></div><div id=rp class=c style="margin-top:10px"><span class=k>Pilih rentang waktu.</span></div>
<h2>Toko</h2><label>Nama toko (tampil di struk)</label><input id=sh value="${esc(D.shop)}" maxlength=40><button class="o w" data-a=shop>Simpan nama toko</button>
<h2>WhatsApp admin (kirim otomatis)</h2><p class=k>Setiap transaksi dikirim otomatis ke WhatsApp admin lewat layanan gateway WhatsApp (contoh: Fonnte). Butuh akun dan token dari penyedia itu.</p><label>Nomor WhatsApp admin</label><input id=wt type=tel inputmode=tel value="${esc(D.wa.to)}" placeholder="0812xxxxxxxx"><label>Token gateway</label><input id=wk type=password value="${esc(D.wa.tok)}" autocomplete=off><label>Alamat API gateway</label><input id=wu value="${esc(D.wa.url)}"><button class="o w" data-a=wasave>Simpan dan kirim pesan tes</button><p class=k>${D.wq.filter(x=>x.st=='PENDING').length} pesan menunggu terkirim. <span id=wm>${esc(wm)}</span></p>
<h2>Bot Telegram (kirim otomatis)</h2><p class=k>Setiap transaksi berhasil dikirim otomatis ke Telegram. Buat bot lewat @BotFather untuk mendapat token, lalu kirim /start ke bot itu. Chat ID Anda bisa dilihat lewat @userinfobot, atau pakai ID grup yang sudah ditambahi bot.</p><label>Token bot</label><input id=tk type=password value="${esc(D.tg.tok)}" autocomplete=off><label>Chat ID</label><input id=tc value="${esc(D.tg.chat)}" placeholder="123456789"><button class="o w" style="margin-bottom:8px" data-a=tgfind>Cari Chat ID otomatis</button><button class="o w" data-a=tgsave>Simpan dan kirim pesan tes</button><p class=k>${D.tq.filter(x=>x.st=='PENDING').length} pesan menunggu terkirim. <span id=tm>${esc(tm)}</span></p>
<h2>QRIS toko</h2><p class=k>Unggah foto atau tangkapan layar kode QRIS toko Anda. Gambar ini tampil di Kasir saat pelanggan membayar dengan QRIS.</p>${D.qris?`<img src="${D.qris}" alt="QRIS toko" style="max-width:220px;border-radius:12px"><button class="o w" style="margin:8px 0" data-a=qdel>Hapus QRIS</button>`:''}<input type=file id=qf accept="image/*"><p class=lo id=qm></p>
<h2>Kasir</h2><label>Nama kasir baru</label><input id=cn maxlength=40><label>PIN kasir (4 sampai 6 angka)</label><input id=cp type=password inputmode=numeric maxlength=6><button class="o w" data-a=adduser>Tambah kasir</button><p class=lo>${esc(msg)}</p>
<h2>Data</h2><div class=r><button class="o f" data-a=csv>Ekspor CSV</button><button class="o f" data-a=bak>Backup</button></div><label style="display:block;margin-top:10px">Pulihkan dari file backup</label><input type=file id=rs accept=".json">`:'')+`<h2></h2><button class="d w" data-a=out>Keluar</button><p class=k>Sinkron cloud, struk Bluetooth, dan scan kamera belum tersedia di versi web ini.</p>`}
function render(){const a=E('#app'),n=E('#nv');if(!U){a.innerHTML=auth();n.innerHTML='';return}
a.innerHTML={home,pos,produk,riwayat,more}[tab]();
n.innerHTML=[['home','Beranda'],['pos','Kasir'],['produk','Produk'],['riwayat','Riwayat'],['more','Lainnya']].map(t=>`<button class="${tab==t[0]?'on':''}" data-a=tab data-i=${t[0]}>${t[1]}</button>`).join('')}
function cartH(){const S=sub();return`<div class="r sb"><h1 style="margin:0">Keranjang</h1><button class="o s" data-a=close>Tutup</button></div>`+cart.map(l=>`<div class=c><div class=r><b class=f>${esc(l.n)}</b><button class="o s" data-a=del data-i="${l.id}" aria-label="Hapus">×</button></div><div class=r><button class="o s" data-a=dec data-i="${l.id}">−</button><input style="width:80px;text-align:center;margin:0" inputmode=numeric value="${l.q}" data-q="${l.id}"><button class="o s" data-a=inc data-i="${l.id}">+</button><b class=f style="text-align:right">${R(l.q*l.p)}</b></div>${l.q>l.stock?`<div class=lo>Stok hanya ${l.stock}. Kurangi jumlahnya.</div>`:''}</div>`).join('')+
`<label>Diskon transaksi (Rp)</label><input id=dc inputmode=numeric value="${disc||''}"><div class="r sb"><span class=k>Subtotal</span><b>${R(S)}</b></div><div class=k>Total belanja</div><div class=big id=tt></div><div class=r style="margin-top:6px"><button class="${pm=='CASH'?'':'o'} f" data-a=meth data-i=CASH>Tunai</button><button class="${pm=='QRIS'?'':'o'} f" data-a=meth data-i=QRIS>QRIS</button></div>${pm=='QRIS'?(D.qris?`<div style="text-align:center;margin:10px 0"><img src="${D.qris}" alt="QRIS toko" style="max-width:100%;max-height:50vh;border-radius:12px"><div class=k>Minta pelanggan memindai, lalu pastikan dana sudah masuk di aplikasi Anda sebelum menekan tombol di bawah.</div></div>`:'<p class=lo>QRIS toko belum dipasang. Pemilik bisa memasangnya di menu Lainnya.</p>'):''}<div style="display:${pm=='CASH'?'block':'none'}"><label>Uang diterima (Rp)</label><input id=pd inputmode=numeric value="${paid||''}"><div class=r><button class="o s f" data-a=cash data-i=0>Uang pas</button>${[20000,50000,100000].map(v=>`<button class="o s f" data-a=cash data-i=${v}>${v/1000}rb</button>`).join('')}</div><div id=kb style="margin:8px 0"></div></div><label>Nomor WhatsApp pelanggan (opsional). Struk otomatis terbuka di WhatsApp setelah bayar</label><input id=wn type=tel inputmode=tel value="${esc(wno)}" placeholder="0812xxxxxxxx"><p class=lo id=em></p><button class=w id=pay data-a=pay>Bayar tunai</button>`}
function upd(){const t=tot(),k=E('#kb');if(!k)return;E('#tt').textContent=R(t);k.innerHTML=paid>=t?`<div class=k>Kembalian</div><div class=big>${R(paid-t)}</div>`:`<span class=lo>Uang masih kurang ${R(t-paid)}</span>`;E('#pay').textContent=pm=='QRIS'?'Pembayaran QRIS sudah masuk':'Bayar tunai';E('#pay').disabled=!cart.length||(pm=='CASH'&&paid<t)||cart.some(l=>l.q>l.stock)||(pm=='QRIS'&&!D.qris)}
function openCart(){if(!cart.length){E('#dl').close();render();return}E('#dl').innerHTML=cartH();if(!E('#dl').open)E('#dl').showModal();upd()}
const rcp=s=>['SMART KASIR PRO',D.shop||'',s.inv,dt(s.t),'Kasir: '+s.cu,'-'.repeat(30),...s.items.flatMap(i=>[i.n,'  '+i.q+' x '+R(i.p)+' = '+R(i.q*i.p)]),'-'.repeat(30),'Total   '+R(s.total),...(s.disc?['Diskon  '+R(s.disc)]:[]),...(s.pay=='QRIS'?['QRIS    '+R(s.total)]:['Tunai   '+R(s.paid),'Kembali '+R(s.paid-s.total)]),'','Terima kasih'].filter(x=>x!==null).join('\n');
const wnum=v=>{v=String(v||'').replace(/\D/g,'');return v.startsWith('0')?'62'+v.slice(1):v.startsWith('8')?'62'+v:v};
const waUrl=s=>'https://wa.me/'+wnum(s.wa)+'?text='+encodeURIComponent(rcp(s));
const RS={s:'rst-abdfee979a03',h:['0b632129311205dfef42374d42863673dda1df528ac50338f52f51ca091b567f','f3078393175']};
let rf=0,rl=0,sc=null;
function stopScan(){if(sc){sc.getTracks().forEach(t=>t.stop());sc=null}}
function gotCode(c){stopScan();E('#dl').close();tab='pos';const p=D.prod.find(x=>x.on&&x.bc==c);q='';msg='';
if(p&&p.stock>0){A.add({i:p.id});navigator.vibrate&&navigator.vibrate(60)}else if(p){msg=p.n+' stoknya habis.';render()}else{q=c;msg='Barcode '+c+' belum terdaftar.';render()}}
async function startScan(){const d=E('#dl');
if(!('BarcodeDetector' in window)||!navigator.mediaDevices){d.innerHTML=hd('Scan barcode')+'<p>Browser ini belum mendukung scan lewat kamera. Pakai Chrome di Android, atau pemindai barcode Bluetooth/USB (hasil scan masuk ke kolom pencarian, lalu Enter).</p><button class=w data-a=close>Tutup</button>';d.showModal();return}
d.innerHTML=hd('Scan barcode')+'<video id=vd playsinline muted style="width:100%;border-radius:12px;background:#000"></video><p class=k id=sm>Arahkan kamera ke barcode.</p><input type=file id=sf accept="image/*" capture=environment hidden><button class=w data-a=sfpick>Ambil foto barcode</button><button class="o w" style="margin-top:8px" data-a=close>Tutup</button>';d.showModal();
try{sc=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=E('#vd');v.srcObject=sc;await v.play();
const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']});
while(sc){try{const r=await det.detect(v);if(r.length){gotCode(r[0].rawValue);return}}catch(e){}await new Promise(z=>setTimeout(z,250))}}
catch(e){const m=E('#sm');if(m){const vv=E('#vd');if(vv)vv.style.display='none';m.textContent='Kamera langsung tidak bisa dibuka ('+(e&&e.name||'error')+'). Halaman yang dibuka dari lampiran WhatsApp tidak boleh memakai kamera. Pakai tombol Ambil foto barcode di bawah, atau buka aplikasi lewat alamat https.'}}}
const BF=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code'];

try{const r=await new BarcodeDetector({formats:BF}).detect(await createImageBitmap(f));
