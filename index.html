<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart Kasir Pro</title>
<style>
:root{--g:#1b5e20;--g2:#2e7d32;--bg:#f4f6f4;--c:#fff;--t:#1a1c1a;--m:#5f6661;--ln:#dfe4df;--er:#b3261e;--wn:#b26a00;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--g:#7bd480;--g2:#5cb862;--bg:#121512;--c:#1c201c;--t:#e8ece8;--m:#9aa39b;--ln:#2b312b;--er:#ff8a80;--wn:#ffb74d;--on:#0b1f0d}}
:root[data-theme=dark]{--g:#7bd480;--g2:#5cb862;--bg:#121512;--c:#1c201c;--t:#e8ece8;--m:#9aa39b;--ln:#2b312b;--er:#ff8a80;--wn:#ffb74d;--on:#0b1f0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{padding:14px 14px 150px;max-width:640px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 10px;color:var(--g)}h2{font-size:1rem;margin:14px 0 6px}
.c{background:var(--c);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--ln)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.g .c{margin:0}
.k{color:var(--m);font-size:.82rem}.v{font-size:1.2rem;font-weight:700;color:var(--g)}.big{font-size:2.1rem;font-weight:800;color:var(--g)}.lo{color:var(--er)}
.r{display:flex;align-items:center;gap:8px}.f{flex:1;min-width:0}.sb{justify-content:space-between}
button,input,select{font:inherit}
button{min-height:52px;border:0;border-radius:12px;padding:0 16px;background:var(--g);color:var(--on);font-weight:700;cursor:pointer}
button.o{background:transparent;color:var(--g);border:1.5px solid var(--g)}button.d{background:var(--er);color:#fff}
button.s{min-height:46px;min-width:46px;padding:0 10px}button:disabled{opacity:.4}
input,select{width:100%;min-height:50px;border:1.5px solid var(--ln);border-radius:10px;padding:0 12px;background:var(--c);color:var(--t);margin:4px 0 8px}
label{font-size:.85rem;color:var(--m)}.w{width:100%}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:60px;background:none;color:var(--m);border-radius:0;font-size:.78rem;padding:0}nav button.on{color:var(--g);box-shadow:inset 0 3px var(--g)}
.fx{position:fixed;left:14px;right:14px;bottom:calc(70px + env(safe-area-inset-bottom,0px));max-width:612px;margin:0 auto}
dialog{border:0;border-radius:18px;padding:16px;width:min(94vw,520px);max-height:90vh;background:var(--c);color:var(--t)}dialog::backdrop{background:#0008}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.pr{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.pr.sl{border-color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--m);flex:none;display:inline-flex;align-items:center;justify-content:center}.ck.on{background:var(--g);border-color:var(--g)}.ck.on:after{content:"✓";color:var(--on);font-weight:800;font-size:15px;line-height:1}
.sbar{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:6px}
#bn{margin:0 0 8px}#bn:empty{display:none}
#ts{position:fixed;inset:auto;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);margin:0;border:0;display:none;background:var(--g);color:var(--on);padding:10px 16px;border-radius:12px;font-weight:700;max-width:90vw;z-index:99;pointer-events:none;box-shadow:0 4px 14px #0004;text-align:center}#ts.on{display:block}
#ts:popover-open{display:block}
#rcp{display:none}@media print{body>*{display:none!important}#rcp{display:block!important;white-space:pre;font:12px monospace;color:#000}@page{margin:2mm}}
</style></head><body>
<main id="app"></main><nav id="nv"></nav><dialog id="dl"></dialog><pre id="rcp"></pre>
<script>
const E=s=>document.querySelector(s),$$=(s,f)=>document.querySelectorAll(s).forEach(f);
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
const R=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const day=t=>new Date(t).toLocaleDateString('sv-SE',{timeZone:'Asia/Jakarta'});
const dt=t=>new Date(t).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'medium',timeStyle:'short'});
const iso=t=>new Date(t+252e5).toISOString().replace('Z','+07:00');
const sum=(a,k)=>a.reduce((x,y)=>x+(y[k]||0),0);
let mem=null;
function load(){try{return JSON.parse(localStorage.getItem('skp'))||mem}catch(e){return mem}}
function save(){mem=D;try{localStorage.setItem('skp',JSON.stringify(D))}catch(e){}}
let D=load()||{dev:uid().slice(0,4).toUpperCase(),shop:'',users:[],cats:['Makanan','Minuman','Rokok','Sembako','Peralatan rumah tangga','Produk kebersihan','Obat-obatan bebas','Lain-lain'],prod:[],sales:[],mov:[],q:[],log:[]};D.tg=D.tg||{tok:'',chat:''};D.tq=D.tq||[];D.qris=D.qris||'';D.wa=D.wa||{url:'https://api.fonnte.com/send',tok:'',to:''};D.wq=D.wq||[];D.mr=D.mr||{};D.bk=Object.assign({tok:'',chat:'',hrs:24,last:0},D.bk);
let U=null,tab='home',cart=[],disc=0,paid=0,q='',sid=null,msg='',fails=0,lock=0,wno='',wm='',tm='',pm='CASH';
const lg=(a,d)=>D.log.push({id:uid(),u:U&&U.id,a,d,t:Date.now(),dev:D.dev});
async function hp(p,s){try{const e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(p),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:e.encode(s),iterations:50000},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s+p)h=(h*33^c.charCodeAt(0))>>>0;return'f'+h}}
const own=()=>U&&U.role=='owner';
const sub=()=>cart.reduce((a,l)=>a+l.q*l.p,0),tot=()=>Math.max(0,sub()-disc);
const hd=t=>`<h1>${t}</h1>`;
function auth(){return D.users.length?hd('Smart Kasir Pro')+`<p class=k>Kasir warung yang tetap jalan tanpa internet</p><label>Siapa yang memakai kasir?</label><select id=lu>${D.users.map(u=>`<option value="${u.id}">${esc(u.name)} (${u.role=='owner'?'pemilik':'kasir'})</option>`).join('')}</select><label>PIN</label><input id=lp type=password inputmode=numeric maxlength=6 autocomplete=off><p class=lo>${esc(msg)}</p><button class=w data-a=login>Masuk</button>`
:hd('Smart Kasir Pro')+`<p class=k>Buat akun pemilik. PIN dipakai setiap kali membuka aplikasi.</p><label>Nama pemilik</label><input id=sn maxlength=40><label>PIN (4 sampai 6 angka)</label><input id=s1 type=password inputmode=numeric maxlength=6><label>Ulangi PIN</label><input id=s2 type=password inputmode=numeric maxlength=6><p class=lo>${esc(msg)}</p><button class=w data-a=setup>Mulai pakai</button>`}
function home(){const td=day(Date.now()),S=D.sales.filter(s=>s.st=='OK'&&day(s.t)==td),P=D.prod.filter(p=>p.on),pend=D.q.filter(x=>x.st=='PENDING').length,top={};
D.sales.filter(s=>s.st=='OK'&&Date.now()-s.t<2592e6).forEach(s=>s.items.forEach(i=>top[i.n]=(top[i.n]||0)+i.q));
const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),on=navigator.onLine,card=(k,v)=>`<div class=c><div class=k>${k}</div><div class=v>${v}</div></div>`;
return hd('Halo, '+esc(U.name))+`<div class=c><span class=dot style="background:${on?'var(--g2)':'var(--wn)'}"></span> ${on?'Online':'Offline'}. ${pend} transaksi tersimpan di HP ini, sinkron cloud belum aktif.</div>
<div class=c><div class=k>Omzet hari ini</div><div class=big>${R(sum(S,'total'))}</div></div>
<div class=g>${own()?card('Laba kotor',R(sum(S,'total')-sum(S,'cost'))):''}${card('Transaksi',S.length)}${card('Jumlah produk',P.length)}${card('Total stok',sum(P,'stock'))}${card('Stok menipis',P.filter(p=>p.stock>0&&p.stock<=p.min).length)}${card('Stok habis',P.filter(p=>p.stock<=0).length)}</div>
<h2>Produk terlaris, 30 hari</h2><div class=c>${tp.map(x=>`<div class="r sb"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')||'<span class=k>Belum ada penjualan.</span>'}</div>
<h2>Transaksi terakhir</h2><div class=c>${D.sales.slice(-5).reverse().map(s=>`<div class="r sb"><span>${s.inv}</span><b>${R(s.total)}</b></div>`).join('')||'<span class=k>Belum ada transaksi.</span>'}</div>`}
const match=p=>!q||(p.n+' '+(p.bc||'')).toLowerCase().includes(q.toLowerCase());
function pl(){const L=D.prod.filter(p=>p.on&&match(p));if(!L.length)return`<p class=k>${D.prod.some(p=>p.on)?'Tidak ada produk yang cocok.':'Belum ada produk. '+(!own()?'Minta pemilik menambahkannya.':tab=='produk'?'Ketuk Scan barcode atau tombol + untuk menambah.':'Tambahkan lewat tab Produk, dengan scan barcode atau tombol +.')}</p>${own()&&!sel&&(tab=='pos'||q)?`<button class=w data-a=padd data-i="${esc(q)}">Tambah produk${q?' ‘'+esc(q)+'’':''}</button>`:''}`;
return L.map(p=>tab=='pos'?`<div class="c r"><div class=f><b>${esc(p.n)}</b><div class=v>${R(p.sell)}</div><div class="k ${p.stock<=p.min?'lo':''}">${p.stock>0?'Stok '+p.stock+' '+esc(p.unit):'Stok habis'}</div></div><button class=s data-a=add data-i="${p.id}" ${p.stock<=0?'disabled':''} aria-label="Tambah ${esc(p.n)}">+</button></div>`
:`<div class="c r pr${sel&&sel.has(p.id)?' sl':''}" ${own()?`data-a=${sel?'ptog':'pedit'} data-i="${p.id}" data-pid="${p.id}"`:''} ${sel?`role=checkbox aria-checked=${sel.has(p.id)}`:''}>${sel?`<span class="ck${sel.has(p.id)?' on':''}" aria-hidden=true></span>`:''}<div class=f><b>${esc(p.n)}</b><div class=k>Beli ${R(p.cost)}, jual ${R(p.sell)}${p.cat?', '+esc(p.cat):''}</div></div><div style="text-align:right"><b class="v ${p.stock<=p.min?'lo':''}">${p.stock}</b><div class=k>${esc(p.unit)}</div></div></div>`).join('')}
function pos(){const n=cart.reduce((a,l)=>a+l.q,0);return hd('Kasir')+`<div class=r><input id=q placeholder="Cari nama atau ketik barcode, lalu Enter" value="${esc(q)}" enterkeyhint=search style="flex:1;min-width:0"><button class=s style="margin-bottom:4px" data-a=scan>Scan</button></div><p class=k style="margin:0 0 6px">Pemindai Bluetooth atau USB juga bisa dipakai: scan kapan saja, barang langsung masuk keranjang.</p>${msg?`<p class=lo>${esc(msg)}</p>`:''}<div id=pl>${pl()}</div>`+(n?`<div class=fx><button class="w r sb" data-a=cart><span>Lihat keranjang (${n} barang)</span><span>${R(sub())}</span></button></div>`:'')}
const ptop=()=>sel?`<div class="r sb"><b>${sel.size?sel.size+' dipilih':'Ketuk produk untuk memilih'}</b><button class="o s" data-a=pnone>Batal</button></div><div class=r style="margin:6px 0 8px"><button class="o f" data-a=pall>Pilih semua</button><button class="d f" data-a=pdel ${sel.size?'':'disabled'}>Hapus (${sel.size})</button></div>`
:`<div class=r style="margin-bottom:8px"><button class=f data-a=pedit data-i="">Tambah produk baru</button><button class="o f" data-a=pscan>Scan barcode</button></div><div class=r style="margin-bottom:8px"><button class="o f" data-a=impick>Impor CSV</button><button class="o f" data-a=psel>Pilih / hapus</button></div>${D.prod.some(p=>p.on)?`<button class="o w" style="margin-bottom:8px;color:var(--er);border-color:var(--er)" data-a=pdelall>Hapus semua produk</button>`:''}<input type=file id=ci accept=".csv,text/csv" hidden><p class=k>Scan barcode: produk terdaftar langsung tampil namanya dan bisa ditambah stoknya. Barcode baru dicarikan namanya lewat internet. Hapus produk: tekan lama sebuah produk, seperti memilih foto.</p><p class=k>Impor CSV: kolom Nama, Barcode, Harga beli, Harga jual, Stok, Satuan, Kategori. Di Excel, simpan sebagai CSV.</p>${msg?`<p class=k><b>${esc(msg)}</b></p>`:''}`;
function produk(){return hd('Produk')+(own()?`<div id=ptb class="${sel?'sbar':''}">${ptop()}</div>`:'')+`<input id=q placeholder="Cari nama atau barcode" value="${esc(q)}"><div id=pl>${pl()}</div>`+(own()?`<button id=fab class=fx data-a=pedit data-i="" style="left:auto;right:14px;width:60px;height:60px;border-radius:30px;font-size:1.8rem;padding:0${sel?';display:none':''}" aria-label="Tambah produk">+</button>`:'')}
function riwayat(){return hd('Riwayat transaksi')+(own()&&D.sales.length?`<button class="o w" style="margin-bottom:10px;color:var(--er);border-color:var(--er)" data-a=rdel>Hapus riwayat transaksi</button>`:'')+(D.sales.slice(-100).reverse().map(s=>`<div class="c r" data-a=sale data-i="${s.id}"><div class=f><b>${s.inv}</b><div class=k>${dt(s.t)}, ${esc(s.cu)}</div><div class=k>${s.sync=='SYNCED'?'Sudah tersinkron':'Tersimpan di HP, menunggu sinkron'}</div></div><b class=v>${R(s.total)}</b></div>`).join('')||'<p class=k>Belum ada transaksi. Transaksi pertama muncul di sini setelah Anda menjual sesuatu di tab Kasir.</p>')}
function more(){return hd('Lainnya')+`<div class=c><b>${esc(U.name)}</b><div class=k>${own()?'Pemilik toko':'Kasir'}</div></div>`+(own()?`<h2>Laporan penjualan</h2><div class=r><button class="o f" data-a=rep data-i=0>Hari ini</button><button class="o f" data-a=rep data-i=7>7 hari</button><button class="o f" data-a=rep data-i=30>30 hari</button></div><div id=rp class=c style="margin-top:10px"><span class=k>Pilih rentang waktu.</span></div><button class="o w" data-a=mrnow>Kirim laporan bulan ini ke Telegram</button><p class=k id=mrs>Laporan bulan sebelumnya juga dikirim otomatis ke Telegram setiap awal bulan, saat aplikasi dibuka.</p>
<h2>Toko</h2><label>Nama toko (tampil di struk)</label><input id=sh value="${esc(D.shop)}" maxlength=40><button class="o w" data-a=shop>Simpan nama toko</button>
<h2>WhatsApp admin (kirim otomatis)</h2><p class=k>Setiap transaksi dikirim otomatis ke WhatsApp admin lewat layanan gateway WhatsApp (contoh: Fonnte). Butuh akun dan token dari penyedia itu. Mengubah pengaturan ini butuh password.</p><label>Nomor WhatsApp admin</label><input id=wt type=tel inputmode=tel value="${esc(D.wa.to)}" placeholder="0812xxxxxxxx"><label>Token gateway</label><input id=wk type=password value="${esc(D.wa.tok)}" autocomplete=off><label>Alamat API gateway</label><input id=wu value="${esc(D.wa.url)}"><button class="o w" data-a=wasave>Simpan dan kirim pesan tes</button><p class=k>${D.wq.filter(x=>x.st=='PENDING').length} pesan menunggu terkirim. <span id=wm>${esc(wm)}</span></p>
<h2>Bot Telegram 1: struk dan laporan</h2><p class=k>Bot ini khusus struk dan laporan. Backup data memakai bot terpisah di bagian bawahnya. Setiap transaksi berhasil dikirim otomatis ke Telegram. Buat bot lewat @BotFather untuk mendapat token, lalu kirim /start ke bot itu. Chat ID Anda bisa dilihat lewat @userinfobot, atau pakai ID grup yang sudah ditambahi bot. Laporan penjualan bulanan juga dikirim ke sini secara otomatis. Mengubah pengaturan ini butuh password.</p><label>Token bot</label><input id=tk type=password value="${esc(D.tg.tok)}" autocomplete=off><label>Chat ID</label><input id=tc value="${esc(D.tg.chat)}" placeholder="123456789"><button class="o w" style="margin-bottom:8px" data-a=tgfind>Cari Chat ID otomatis</button><button class="o w" data-a=tgsave>Simpan dan kirim pesan tes</button><p class=k>${D.tq.filter(x=>x.st=='PENDING').length} pesan menunggu terkirim. <span id=tm>${esc(tm)}</span></p>
<h2>Bot Telegram 2: backup data otomatis</h2><p class=k>Bot terpisah khusus backup, tidak bercampur dengan bot struk dan laporan. Buat bot baru lewat @BotFather, kirim /start ke bot itu, lalu isi token dan Chat ID di bawah. File backup (.json) dikirim otomatis selama aplikasi terbuka. Kalau aplikasi sedang ditutup, backup menyusul saat aplikasi dibuka lagi. Token tidak ikut tersimpan di dalam file backup. Mengubah pengaturan ini butuh password.</p><label>Token bot backup</label><input id=bkt type=password value="${esc(D.bk.tok)}" autocomplete=off><label>Chat ID backup</label><input id=bkc value="${esc(D.bk.chat)}" placeholder="123456789"><button class="o w" style="margin-bottom:8px" data-a=bkfind>Cari Chat ID otomatis</button><label>Backup otomatis</label><select id=bkf>${[[0,'Mati'],[1,'Setiap 1 jam'],[3,'Setiap 3 jam'],[6,'Setiap 6 jam'],[12,'Setiap 12 jam'],[24,'Setiap 24 jam']].map(o=>`<option value=${o[0]} ${o[0]==D.bk.hrs?'selected':''}>${o[1]}</option>`).join('')}</select><button class="o w" data-a=bksave>Simpan dan kirim backup tes</button><button class="o w" style="margin-top:8px" data-a=bknow>Kirim backup sekarang</button><p class=k>Backup terakhir terkirim: <span id=bkl>${D.bk.last?dt(D.bk.last):'belum pernah'}</span>. <span id=bkm>${esc(bm)}</span></p>
<h2>QRIS toko</h2><p class=k>Unggah foto atau tangkapan layar kode QRIS toko Anda. Gambar ini tampil di Kasir saat pelanggan membayar dengan QRIS. Mengubah atau menghapus QRIS butuh password.</p>${D.qris?`<img src="${D.qris}" alt="QRIS toko" style="max-width:220px;border-radius:12px"><button class="o w" style="margin:8px 0" data-a=qdel>Hapus QRIS</button>`:''}<button class="o w" data-a=qup>${D.qris?'Ganti QRIS':'Unggah QRIS'}</button>
<h2>Kasir</h2><label>Nama kasir baru</label><input id=cn maxlength=40><label>PIN kasir (4 sampai 6 angka)</label><input id=cp type=password inputmode=numeric maxlength=6><button class="o w" data-a=adduser>Tambah kasir</button><p class=lo>${esc(msg)}</p>
<h2>Data</h2><div class=r><button class="o f" data-a=csv>Ekspor CSV</button><button class="o f" data-a=bak>Backup</button></div><label style="display:block;margin-top:10px">Pulihkan dari file backup</label><input type=file id=rs accept=".json">`:'')+`<h2></h2><button class="d w" data-a=out>Keluar</button><p class=k>Sinkron cloud, struk Bluetooth, dan scan kamera belum tersedia di versi web ini.</p>`}
function render(){const a=E('#app'),n=E('#nv');if(!U){a.innerHTML=auth();n.innerHTML='';return}
if(tab!='produk')sel=null;a.innerHTML={home,pos,produk,riwayat,more}[tab]();
